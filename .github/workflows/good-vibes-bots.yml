# Robôs da casa do Good Vibes 🌊🤖
# Roda a cada 25 minutos (e sob demanda). Nada aqui publica no site —
# apenas interage com o Firestore como usuários robô (com 🤖 no nome).
name: Good Vibes Bots 🤖

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: bots
        run: npm install --no-audit --no-fund

      - name: Restaurar estado dos bots (dedup de likes/comentários/shares)
        uses: actions/cache@v4
        with:
          path: bots/bot-state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Rodar os robôs
        working-directory: bots
        env:
          BOT_MASTER_KEY: ${{ secrets.BOT_MASTER_KEY }}
          # gh variable set BOT_ENABLED --body "false"  → pausa tudo
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'true' }}
          # gh variable set SITE_URL --body "https://seu-site.com/"
          SITE_URL: ${{ vars.SITE_URL }}
          MAX_LIKES: ${{ vars.MAX_LIKES || '12' }}
          MAX_COMMENTS: ${{ vars.MAX_COMMENTS || '5' }}
          MAX_SHARES: ${{ vars.MAX_SHARES || '2' }}
        run: node good-vibes-bots.mjs
